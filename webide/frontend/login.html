<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kết nối iOS Auto Tool</title>
<style>body{margin:0;background:#10131c;color:#edf0ff;font:16px system-ui;min-height:100vh;display:grid;place-items:center}form{width:min(380px,84vw);padding:32px;background:#1a2030;border:1px solid #343e55;border-radius:20px}h1{font-size:24px}p{color:#aab8d1;line-height:1.5}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;border:1px solid #435477;margin:8px 0;font:inherit}input{background:#111725;color:#fff}button{background:#718aff;border:0;color:#0b1022;font-weight:700;cursor:pointer}#error{color:#ffb3bd;min-height:24px}</style>
<form id="login"><h1>iOS Auto Tool</h1><p>Nhập mã kết nối của thiết bị để mở trình soạn thảo và điều khiển iPhone.</p><label for="token">Mã kết nối</label><input id="token" type="password" autocomplete="current-password" required autofocus maxlength="64"><button>Kết nối</button><p id="error" role="alert"></p></form>
<script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('button');button.disabled=true;try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.querySelector('input').value.trim()})});if(r.ok)location.replace('/');else document.querySelector('#error').textContent='Mã kết nối không đúng. Hãy kiểm tra lại.';}catch{document.querySelector('#error').textContent='Không kết nối được với thiết bị.';}finally{button.disabled=false;}});</script></html>
